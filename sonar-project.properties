# =====================================================================
# SonarQube & SonarCloud Configuration for Alpha Centauri Protocol
# =====================================================================

# Project Identification
sonar.projectKey=alpha-centauri-protocol
sonar.organization=alpha-centauri-dao
sonar.projectName=Alpha Centauri Protocol (Pure DeFi Ecosystem)
sonar.projectVersion=2.6.0-enterprise

# Source Directories
sonar.sources=frontend/src,services/core/src
sonar.tests=frontend/src/__tests__,services/core/src/__tests__,tests

# Encoding & Language Settings
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=frontend/tsconfig.json,services/tsconfig.json

# File Exclusions (Build Artifacts, Generated Typings, Contracts)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/out/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.d.ts,\
  contracts/**,\
  frontend/dist/**,\
  frontend/scripts/**

# Test Coverage Integration
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.testExecutionReportPaths=frontend/test-report.xml

# Quality Gate Configuration
sonar.qualitygate.wait=true
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts
