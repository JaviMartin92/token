name: Alpha Centauri Institutional Quality Gate & DevSecOps Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. SMART CONTRACT SECURITY & STATIC ANALYSIS (Web3 Core)
  # =========================================================================
  contracts-security-and-invariants:
    name: 🛡️ Smart Contracts Static Analysis, Invariants & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry Toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Verify Code Formatting
        run: |
          cd contracts
          forge fmt --check

      - name: Run Solhint Linter & Security Rules
        run: |
          npx solhint "contracts/src/**/*.sol"

      - name: Run Slither Static Analysis (Trail of Bits)
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: 'contracts'
          slither-config: 'contracts/slither.config.json'
          fail-on: 'high'

      - name: Execute Foundry Invariant & Fuzzing Suites (10,000 runs)
        run: |
          cd contracts
          forge test --gas-report -vvv

      - name: Enforce Formal Code Coverage (Threshold >= 80%)
        run: |
          cd contracts
          forge coverage --report summary > coverage_summary.txt
          cat coverage_summary.txt
          LINE_COV=$(grep -A 5 "Total" coverage_summary.txt | grep "Lines" | awk '{print $4}' | tr -d '%')
          echo "Total Line Coverage: $LINE_COV%"
          if awk "BEGIN {exit !($LINE_COV >= 80.0)}"; then
            echo "✅ Coverage verification passed."
          else
            echo "❌ Coverage fell below 80% threshold."
            exit 1
          fi

  # =========================================================================
  # 2. TYPESCRIPT, FRONTEND & BACKEND QUALITY (Web2 / App Layer)
  # =========================================================================
  typescript-quality-and-tests:
    name: 💎 TypeScript Quality, Typecheck & React Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Compilation (Zero Errors)
        run: |
          cd frontend && npx tsc -b --noEmit
          cd ../services && npx tsc --noEmit

      - name: Fast Linter Execution (Oxlint)
        run: |
          cd frontend && npm run lint

      - name: Execute Frontend Unit Tests (Vitest)
        run: |
          cd frontend && npm run test:ci

      - name: Execute Backend Architecture Tests (Reorgs & PoR Reconciler)
        run: |
          npm run test:backend

      - name: Verify Contract Alignment Interfaces
        run: |
          npm run test:alignment

      - name: Production Bundle Verification
        run: |
          npm run test:frontend:build

  # =========================================================================
  # 3. SONARCLOUD / SONARQUBE ENTERPRISE CODE SMELL SCAN
  # =========================================================================
  sonarcloud-scan:
    name: 📊 SonarQube / SonarCloud Enterprise Quality Scan
    runs-on: ubuntu-latest
    needs: [typescript-quality-and-tests]
    if: env.SONAR_TOKEN != ''
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Generate Coverage
        run: |
          npm ci
          cd frontend && npm run test:ci -- --coverage

      - name: Run SonarCloud Scanner
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # =========================================================================
  # 4. DEPENDENCY & SUPPLY CHAIN SECURITY AUDIT
  # =========================================================================
  supply-chain-security:
    name: 🔒 Supply Chain & Dependency CVE Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run NPM Audit & Audit-CI
        run: |
          npm audit --audit-level=high
