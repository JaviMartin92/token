name: Alpha Centauri CI/CD & Security Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  solidity-tests:
    name: Smart Contract Tests & Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge Tests & Fuzzing
        run: |
          cd contracts
          forge test --verbosity 2

  frontend-typecheck:
    name: Frontend TypeScript & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies & Type Check
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
          npm run build